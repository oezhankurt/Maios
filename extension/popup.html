<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .popup-container {
      padding: 16px;
    }

    .popup-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-right: 8px;
    }

    .version {
      font-size: 11px;
      color: #999;
      margin-left: auto;
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .status.connected {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 3px solid #4caf50;
    }

    .status.disconnected {
      background: #ffebee;
      color: #c62828;
      border-left: 3px solid #f44336;
    }

    .features {
      list-style: none;
      margin-bottom: 16px;
    }

    .features li {
      padding: 8px 0;
      font-size: 13px;
      color: #666;
    }

    .features li:before {
      content: "✓ ";
      color: #667eea;
      font-weight: bold;
      margin-right: 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .info {
      font-size: 12px;
      color: #999;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="logo">Maios</div>
      <div class="version">v1.0</div>
    </div>

    <div id="status" class="status connected">
      ✓ Extension aktiv
    </div>

    <ul class="features">
      <li>Amazon.de Produktdaten</li>
      <li>Otto.de Produktdaten</li>
      <li>Echtzeit Wettbewerbsanalyse</li>
      <li>Verkaufsmetriken</li>
    </ul>

    <div class="actions">
      <button class="btn-primary" id="openDashboard">Maios öffnen</button>
      <button class="btn-secondary" id="settings">⚙️</button>
    </div>

    <div class="info">
      Auf Amazon.de oder Otto.de öffnet sich<br>automatisch ein Daten-Panel
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
