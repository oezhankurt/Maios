version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: maios-postgres
    environment:
      POSTGRES_USER: maios_user
      POSTGRES_PASSWORD: maios_password
      POSTGRES_DB: maios_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maios_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
